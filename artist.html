<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopora Music - Artist Portal</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #171321;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      padding: 25px;
      background: #241e32;
      border-radius: 15px;
    }

    h1 {
      color: #f4c75e;
      text-align: center;
    }

    p {
      text-align: center;
      color: #ddd;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <div class="container">
    <h1>♫ Shopora Music</h1>
    <p>Artist Portal</p>

    <h2>Welcome, Artists!</h2>
    <p>Register, upload your music, and share your sound with the world.</p>

    
    
<h2>Artist Registration</h2>

<form id="signup-form">
  <label for="artist-name">Artist or stage name</label>
  <input id="artist-name" type="text" required
         placeholder="Enter your artist name">

  <label for="signup-email">Email address</label>
  <input id="signup-email" type="email" required
         placeholder="Enter your email">

  <label for="signup-password">Password</label>
  <input id="signup-password" type="password"
         minlength="6" required
         placeholder="Create a password">

  <button type="submit">Register as Artist</button>
</form>

<hr>

<h2>Artist Sign In</h2>

<form id="login-form">
  <label for="login-email">Email address</label>
  <input id="login-email" type="email" required
         placeholder="Enter your email">

  <label for="login-password">Password</label>
  <input id="login-password" type="password" required
         placeholder="Enter your password">

  <button type="submit">Sign In</button>
</form>

<p id="artist-status">Welcome to Shopora Music!</p>

    
<hr>

<h2>Upload Your Music</h2>
<p>Share your music with Shopora Music listeners.</p>

<form id="upload-form" style="display:none;">

  <label for="song-title">Song Title</label>
  <input
    type="text"
    id="song-title"
    required
    placeholder="Enter song title"
  >

  <label for="song-genre">Music Genre</label>
  <select id="song-genre" required>
    <option value="">Choose a genre</option>
    <option value="Afrobeats">Afrobeats</option>
    <option value="Gospel">Gospel</option>
    <option value="Hip-hop">Hip-hop</option>
    <option value="R&B">R&B</option>
    <option value="Reggae">Reggae</option>
    <option value="Pop">Pop</option>
    <option value="Dancehall">Dancehall</option>
    <option value="Traditional">Traditional</option>
  </select>

  <label for="song-description">Song Description</label>
  <textarea
    id="song-description"
    placeholder="Tell listeners about your song"
  ></textarea>

  <label for="song-file">Select Audio File</label>
  <input
    type="file"
    id="song-file"
    accept="audio/*"
    required
  >

  <button type="submit">Submit Music</button>

</form>
    
    
  </div>
  <script>
const SUPABASE_URL = "https://zhkmsdsypljlhwdfcury.supabase.co";

const SUPABASE_KEY = "sb_publishable_mu3TQraTI0MVublU16j5Kg_bxcakNPB";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

    
    
const artistStatus = document.getElementById("artist-status");

// Artist registration
document.getElementById("signup-form").addEventListener("submit", async function(e) {
  e.preventDefault();

  artistStatus.textContent = "Creating your artist account...";

  const artistName = document.getElementById("artist-name").value.trim();
  const email = document.getElementById("signup-email").value.trim();
  const password = document.getElementById("signup-password").value;

  const { data, error } = await supabaseClient.auth.signUp({
    email: email,
    password: password,
    options: {
      data: {
        display_name: artistName
      }
    }
  });

  if (error) {
    artistStatus.textContent = error.message;
    return;
  }

  artistStatus.textContent =
    "Registration successful! Check your email if confirmation is required.";
});

// Artist sign-in
document.getElementById("login-form").addEventListener("submit", async function(e) {
  e.preventDefault();

  artistStatus.textContent = "Signing in...";

  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value;

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    artistStatus.textContent = error.message;
    return;
  }

  artistStatus.textContent = "Welcome! You are signed in to Shopora Music.";
});
    document.getElementById("upload-form").style.display = "block";
    
    
// Submit music to Shopora Music
document.getElementById("upload-form").addEventListener("submit", async function(e) {
  e.preventDefault();

  artistStatus.textContent = "Preparing your music upload...";

  const { data: userData, error: userError } =
    await supabaseClient.auth.getUser();

  if (userError || !userData.user) {
    artistStatus.textContent = "Please sign in before uploading music.";
    return;
  }

  const user = userData.user;
  const title = document.getElementById("song-title").value.trim();
  const genre = document.getElementById("song-genre").value;
  const description = document.getElementById("song-description").value.trim();
  const file = document.getElementById("song-file").files[0];

  if (!file) {
    artistStatus.textContent = "Please select an audio file.";
    return;
  }

  const allowedTypes = [
    "audio/mpeg",
    "audio/mp4",
    "audio/aac",
    "audio/ogg",
    "audio/wav"
  ];

  if (!allowedTypes.includes(file.type)) {
    artistStatus.textContent = "Please use MP3, MP4 audio, AAC, OGG, or WAV.";
    return;
  }

  if (file.size > 20 * 1024 * 1024) {
    artistStatus.textContent = "Your audio file must not exceed 20 MB.";
    return;
  }

  const safeName = file.name
    .split("/")
    .pop()
    .replace(/[^a-zA-Z0-9._-]/g, "-");

  const storagePath = user.id + "/" + Date.now() + "-" + safeName;

  artistStatus.textContent = "Uploading your music...";

  const { error: uploadError } = await supabaseClient
    .storage
    .from("shopora-music")
    .upload(storagePath, file, {
      contentType: file.type,
      upsert: false
    });

  if (uploadError) {
    artistStatus.textContent = "Upload failed: " + uploadError.message;
    return;
  }

  const { error: songError } = await supabaseClient
    .from("songs")
    .insert({
      artist_id: user.id,
      title: title,
      description: description,
      genre: genre,
      storage_path: storagePath,
      status: "pending"
    });

  if (songError) {
    await supabaseClient.storage
      .from("shopora-music")
      .remove([storagePath]);

    artistStatus.textContent = "Song record failed: " + songError.message;
    return;
  }

  artistStatus.textContent =
    "Music submitted successfully! It is waiting for administrator approval.";

  document.getElementById("upload-form").reset();
});
    
  </script>
</body>
</html>
