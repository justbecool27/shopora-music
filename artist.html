<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopora Music - Artist Portal</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #171321;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      padding: 25px;
      background: #241e32;
      border-radius: 15px;
    }

    h1 {
      color: #f4c75e;
      text-align: center;
    }

    p {
      text-align: center;
      color: #ddd;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <div class="container">
    <h1>♫ Shopora Music</h1>
    <p>Artist Portal</p>

    <h2>Welcome, Artists!</h2>
    <p>Register, upload your music, and share your sound with the world.</p>
  </div>
  <script>
const SUPABASE_URL = "https://zhkmsdsypljlhwdfcury.supabase.co";

const SUPABASE_KEY = "sb_publishable_mu3TQraTI0MVublU16j5Kg_bxcakNPB";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

    
    
<h2>Artist Registration</h2>

<form id="signup-form">
  <label for="artist-name">Artist or stage name</label>
  <input id="artist-name" type="text" required
         placeholder="Enter your artist name">

  <label for="signup-email">Email address</label>
  <input id="signup-email" type="email" required
         placeholder="Enter your email">

  <label for="signup-password">Password</label>
  <input id="signup-password" type="password"
         minlength="6" required
         placeholder="Create a password">

  <button type="submit">Register as Artist</button>
</form>

<hr>

<h2>Artist Sign In</h2>

<form id="login-form">
  <label for="login-email">Email address</label>
  <input id="login-email" type="email" required
         placeholder="Enter your email">

  <label for="login-password">Password</label>
  <input id="login-password" type="password" required
         placeholder="Enter your password">

  <button type="submit">Sign In</button>
</form>

<p id="artist-status">Welcome to Shopora Music!</p>

    
const artistStatus = document.getElementById("artist-status");

// Artist registration
document.getElementById("signup-form").addEventListener("submit", async function(e) {
  e.preventDefault();

  artistStatus.textContent = "Creating your artist account...";

  const artistName = document.getElementById("artist-name").value.trim();
  const email = document.getElementById("signup-email").value.trim();
  const password = document.getElementById("signup-password").value;

  const { data, error } = await supabaseClient.auth.signUp({
    email: email,
    password: password,
    options: {
      data: {
        display_name: artistName
      }
    }
  });

  if (error) {
    artistStatus.textContent = error.message;
    return;
  }

  artistStatus.textContent =
    "Registration successful! Check your email if confirmation is required.";
});

// Artist sign-in
document.getElementById("login-form").addEventListener("submit", async function(e) {
  e.preventDefault();

  artistStatus.textContent = "Signing in...";

  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value;

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    artistStatus.textContent = error.message;
    return;
  }

  artistStatus.textContent = "Welcome! You are signed in to Shopora Music.";
});
    
    
  </script>
</body>
</html>
