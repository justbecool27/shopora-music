
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopora Music - Admin Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #171321;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 800px;
      margin: 30px auto;
      padding: 25px;
      background: #241e32;
      border-radius: 15px;
    }

    h1, h2 {
      color: #f4c75e;
    }

    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 8px 0;
      border-radius: 7px;
      border: none;
    }

    button {
      background: #f4c75e;
      color: #171321;
      font-weight: bold;
      cursor: pointer;
    }

    .song {
      background: #352b46;
      padding: 15px;
      margin: 15px 0;
      border-radius: 10px;
    }

    .song button {
      width: 48%;
    }

    #dashboard {
      display: none;
    }

    #status {
      color: #f4c75e;
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>♫ Shopora Music</h1>
    <h2>Administrator Dashboard</h2>

    <section id="login">
      <h2>Admin Sign In</h2>

      <form id="login-form">
        <input
          type="email"
          id="email"
          placeholder="Administrator email"
          required
        >

        <input
          type="password"
          id="password"
          placeholder="Password"
          required
        >

        <button type="submit">Sign In</button>
      </form>
    </section>

    <section id="dashboard">
      <h2>Submitted Songs</h2>
      <div id="song-list">Loading songs...</div>

      <button id="logout-button">Sign Out</button>
    </section>

    <p id="status">Please sign in.</p>

  </div>

  <script>
    const SUPABASE_URL =
      "https://zhkmsdsypljlhwdfcury.supabase.co";

    const SUPABASE_KEY = "sb_publishable_mu3TQraTI0MVublU16j5Kg_bxcakNPB";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const statusBox = document.getElementById("status");

    document.getElementById("login-form")
      .addEventListener("submit", async function(e) {
        e.preventDefault();

        statusBox.textContent = "Signing in...";

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) {
          statusBox.textContent = error.message;
          return;
        }

        document.getElementById("password").value = "";
        statusBox.textContent = "Signed in. Checking administrator access...";

        const { data: admin, error: adminError } =
          await supabaseClient
            .from("admins")
            .select("user_id")
            .eq("user_id", data.user.id)
            .maybeSingle();

        if (adminError || !admin) {
          await supabaseClient.auth.signOut();
          statusBox.textContent =
            "Access denied. This account is not an authorized administrator.";
          return;
        }

        document.getElementById("login").style.display = "none";
        document.getElementById("dashboard").style.display = "block";

        loadPendingSongs();
      });

    async function loadPendingSongs() {
      const songList = document.getElementById("song-list");

      songList.textContent = "Loading pending songs...";

      const { data: songs, error } = await supabaseClient
        .from("songs")
        .select("id, title, genre, description, storage_path, status")
        .eq("status", "pending")
        .order("created_at", { ascending: false });

      if (error) {
        songList.textContent = "Error: " + error.message;
        return;
      }

      if (!songs.length) {
        songList.textContent = "No pending songs.";
        return;
      }

      songList.innerHTML = "";

      songs.forEach(song => {
        const item = document.createElement("div");
        item.className = "song";

        const heading = document.createElement("h3");
        heading.textContent = song.title;

        const details = document.createElement("p");
        details.textContent = song.genre + " | " + song.status;

        item.appendChild(heading);
        item.appendChild(details);

        songList.appendChild(item);
      });
    }

    document.getElementById("logout-button")
      .addEventListener("click", async function() {
        await supabaseClient.auth.signOut();
        location.reload();
      });
  </script>
</body>
</html>
