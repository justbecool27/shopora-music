
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopora Music - Admin Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #171321;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 800px;
      margin: 30px auto;
      padding: 25px;
      background: #241e32;
      border-radius: 15px;
    }

    h1, h2 {
      color: #f4c75e;
    }

    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 8px 0;
      border-radius: 7px;
      border: none;
    }

    button {
      background: #f4c75e;
      color: #171321;
      font-weight: bold;
      cursor: pointer;
    }

    .song {
      background: #352b46;
      padding: 15px;
      margin: 15px 0;
      border-radius: 10px;
    }

    .song button {
      width: 48%;
    }

    #dashboard {
      display: none;
    }

    #status {
      color: #f4c75e;
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>♫ Shopora Music</h1>
    <h2>Administrator Dashboard</h2>

    <section id="login">
      <h2>Admin Sign In</h2>

      <form id="login-form">
        <input
          type="email"
          id="email"
          placeholder="Administrator email"
          required
        >

        <input
          type="password"
          id="password"
          placeholder="Password"
          required
        >

        <button type="submit">Sign In</button>
      </form>
    </section>

    <section id="dashboard">
      <h2>Submitted Songs</h2>
      <div id="song-list">Loading songs...</div>

      <button id="logout-button">Sign Out</button>
    </section>

    <p id="status">Please sign in.</p>

  </div>

  <script>
    const SUPABASE_URL =
      "https://zhkmsdsypljlhwdfcury.supabase.co";

    const SUPABASE_KEY = "sb_publishable_mu3TQraTI0MVublU16j5Kg_bxcakNPB";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const statusBox = document.getElementById("status");

    document.getElementById("login-form")
      .addEventListener("submit", async function(e) {
        e.preventDefault();

        statusBox.textContent = "Signing in...";

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) {
          statusBox.textContent = error.message;
          return;
        }

        document.getElementById("password").value = "";
        statusBox.textContent = "Signed in. Checking administrator access...";

        const { data: admin, error: adminError } =
          await supabaseClient
            .from("admins")
            .select("user_id")
            .eq("user_id", data.user.id)
            .maybeSingle();

if (adminError) {
  await supabaseClient.auth.signOut();
  statusBox.textContent =
    "Administrator check error: " + adminError.message;
  return;
}

if (!admin) {
  await supabaseClient.auth.signOut();
  statusBox.textContent =
    "No administrator record was found for this signed-in account.";
  return;
}
        
        document.getElementById("login").style.display = "none";
        document.getElementById("dashboard").style.display = "block";

        loadPendingSongs();
      });

    
    async function loadPendingSongs() {
  const songList = document.getElementById("song-list");

  songList.textContent = "Loading pending songs...";

  const { data: songs, error } = await supabaseClient
    .from("songs")
    .select("id, title, genre, description, storage_path, status")
    .eq("status", "pending")
    .order("created_at", { ascending: false });

  if (error) {
    songList.textContent = "Error: " + error.message;
    return;
  }

  if (!songs || songs.length === 0) {
    songList.textContent = "No pending songs.";
    return;
  }

  songList.innerHTML = "";

  for (const song of songs) {
    const item = document.createElement("div");
    item.className = "song";

    const heading = document.createElement("h3");
    heading.textContent = song.title;

    const details = document.createElement("p");
    details.textContent = song.genre + " | " + song.status;

    const description = document.createElement("p");
    description.textContent =
      song.description || "No description provided.";

    const audio = document.createElement("audio");
    audio.controls = true;
    audio.style.width = "100%";

    const { data: signed, error: audioError } =
      await supabaseClient.storage
        .from("shopora-music")
        .createSignedUrl(song.storage_path, 3600);

    if (audioError) {
      const audioMessage = document.createElement("p");
      audioMessage.textContent =
        "Audio preview unavailable: " + audioError.message;
      item.appendChild(audioMessage);
    } else {
      audio.src = signed.signedUrl;
      item.appendChild(audio);
    }

    const approveButton = document.createElement("button");
    approveButton.textContent = "Approve Song";

    approveButton.addEventListener("click", async function() {
      if (!confirm("Approve this song?")) return;

      approveButton.disabled = true;

      const { data, error } = await supabaseClient
        .from("songs")
        .update({ status: "approved" })
        .eq("id", song.id)
        .eq("status", "pending")
        .select("id");

      if (error || !data || data.length === 0) {
        alert("Approval failed: " + (error ? error.message : "No song was updated."));
        approveButton.disabled = false;
        return;
      }

      alert("Song approved successfully!");
      await loadPendingSongs();
    });

    const rejectButton = document.createElement("button");
    rejectButton.textContent = "Reject Song";

    rejectButton.addEventListener("click", async function() {
      if (!confirm("Reject this song?")) return;

      rejectButton.disabled = true;

      const { data, error } = await supabaseClient
        .from("songs")
        .update({ status: "rejected" })
        .eq("id", song.id)
        .eq("status", "pending")
        .select("id");

      if (error || !data || data.length === 0) {
        alert("Rejection failed: " + (error ? error.message : "No song was updated."));
        rejectButton.disabled = false;
        return;
      }

      alert("Song rejected.");
      await loadPendingSongs();
    });

    item.appendChild(heading);
    item.appendChild(details);
    item.appendChild(description);
    item.appendChild(approveButton);
    item.appendChild(rejectButton);

    songList.appendChild(item);
  }
}
    

    
  </script>
</body>
</html>
